<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login & Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-container">
    <!-- Login Form -->
    <div class="form-box" id="login-box">
      <h2>Login</h2>
      <form onsubmit="return validateLoginForm()">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
      <p class="toggle-text">Don't have an account? <span onclick="showSignup()">Sign up</span></p>
    </div>

    <!-- Signup Form -->
    <div class="form-box hidden" id="signup-box">
      <h2>Signup</h2>
      <form onsubmit="return validateSignupForm()">
        <input type="text" id="signup-name" placeholder="Full Name" required />
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password" required />
        <button type="submit">Signup</button>
      </form>
      <p class="toggle-text">Already have an account? <span onclick="showLogin()">Login</span></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
